name: workflow-dispatch-example
on: 
    workflow_dispatch:
     inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'information'
        type: choice
        options:
          - information
          - debug
          - warning
          - critical
      tags:
        description: 'Purpose of Run This Workflow?'
        required: true
        type: string

jobs:
    
    print-tag:
        environment: production
        runs-on: ubuntu-latest
        steps:
        - name: Print the purpose of run
          run: |

             echo  ${{ inputs.tags }} purpose
             echo "the name is ${{ vars.NAME }}"
             echo "surname is ${{ secrets. SURNAME}}"
